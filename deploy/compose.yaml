services:
  worker:
    image: tc002-apps/worker:local
    build:
      context: ..
      args:
        APP: worker
    volumes: &project-config
      - type: bind
        source: ../configs
        target: /app/configs
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clockctl:
    image: tc002-apps/clockctl:local
    profiles: [tools]
    build:
      context: ..
      args:
        APP: clockctl
    volumes: *project-config
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
