services:
  awtrix:
    build:
      context: .
      dockerfile: Dockerfile.awtrix
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - awtrix-data:/data
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  clockctl:
    profiles: [tools]
    build:
      context: ..
      args:
        APP: clockctl
    environment:
      AWTRIX_URL: http://awtrix:8080
    depends_on:
      awtrix:
        condition: service_healthy

  worker:
    profiles: [tools]
    build:
      context: ..
      args:
        APP: worker

volumes:
  awtrix-data:
