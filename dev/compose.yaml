services:
  awtrix:
    build: &awtrix-build
      context: .
      dockerfile: Dockerfile.awtrix
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - awtrix-data:/data
    init: true
    healthcheck: &awtrix-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

  awtrix-check:
    profiles: [checks]
    image: tc002-apps/awtrix-check:local
    build: *awtrix-build
    init: true
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0700
    healthcheck: *awtrix-health

  clock-check:
    profiles: [checks]
    image: tc002-apps/tools/clockctl:check
    build: &tools-build
      context: ..
      dockerfile: apps/tools/Dockerfile
      args:
        APP: clockctl
    working_dir: /repo
    environment:
      TC002_CHECK_SANDBOX: "1"
      TC002_CHECK_ARTIFACTS: /artifacts
    user: "${CHECK_UID:-10001}:${CHECK_GID:-10001}"
    volumes:
      - ..:/repo:ro
      - ../dist/clock-check:/artifacts
    depends_on:
      awtrix-check:
        condition: service_healthy

  status-check:
    profiles: [checks]
    image: tc002-apps/server/status-check:local
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      target: integration
    environment:
      TC002_INTEGRATION_URL: http://awtrix-check:8080
    volumes:
      - ..:/repo:ro
    depends_on:
      awtrix-check:
        condition: service_healthy

  clockctl:
    profiles: [tools]
    build: *tools-build
    environment:
      AWTRIX_URL: http://awtrix:8080
      TC002_LOCAL_CONFIG: ""
    volumes:
      - ../configs:/app/configs:ro
      - ../apps/clock:/app/apps/clock:ro
    depends_on:
      awtrix:
        condition: service_healthy

  worker:
    profiles: [server]
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      args:
        APP: worker
    environment:
      TC002_LOCAL_CONFIG: ""
    volumes:
      - ../configs:/app/configs:ro

volumes:
  awtrix-data:
