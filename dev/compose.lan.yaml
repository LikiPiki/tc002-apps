# Local server processes publishing to a physical clock on the same LAN.
x-project-environment: &project-environment
  AWTRIX_URL: ${AWTRIX_URL:-}
  TC002_CONFIG: ${CONFIG:-configs/config.toml}
  TC002_LOCAL_CONFIG: ${LOCAL_CONFIG-configs/config.local.toml}

services:
  server:
    extends:
      file: ../deploy/compose.yaml
      service: server
    image: tc002-apps/server:lan
    restart: "no"
    environment: *project-environment

  clockctl:
    profiles: [tools]
    build:
      context: ..
      dockerfile: apps/tools/Dockerfile
      args:
        APP: clockctl
    environment: *project-environment
    volumes:
      - type: bind
        source: ../configs
        target: /app/configs
        read_only: true
        bind:
          create_host_path: false
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
