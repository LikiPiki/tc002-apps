# Shared project defaults. Override selected fields in config.local.toml.
[clock]
url = "http://localhost:8080"
[clock.deploy]
screens = ["*"]
services = ["display-policy"]
on_demand = ["*"] # Installed in the device menu; not started by deployment.

[clock.services.display-policy]
schedule_enabled = false # Opt in locally to automatic display power control.
on = "10:00"    # Inclusive, in the clock's configured local timezone.
off = "20:00"   # Exclusive; overnight windows are supported.

[server]
apps = ["*"] # Go commands to build from apps/server/cmd/

[server.worker]
interval = "1m"

[tools]
apps = ["*"] # CLI utilities, built separately from VPS services.
