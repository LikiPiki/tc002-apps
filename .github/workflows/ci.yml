name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: make check
      - run: make sprites-check
      - run: make build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.yaml config --quiet
      - run: docker compose -f dev/compose.yaml --profile tools --profile server --profile checks config --quiet
      - run: docker compose -f dev/compose.lan.yaml --profile '*' config --quiet
      - run: make docker-build CONFIG_RUNNER=docker

  berry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build cached headless AWTRIX
        uses: docker/build-push-action@v6
        with:
          context: ./dev
          file: ./dev/Dockerfile.awtrix
          load: true
          tags: tc002-apps/awtrix-check:local
          cache-from: type=gha,scope=awtrix-check
          cache-to: type=gha,mode=max,scope=awtrix-check
      - name: Build cached clock-check runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/tools/Dockerfile
          build-args: APP=clockctl
          load: true
          tags: tc002-apps/tools/clockctl:check
          cache-from: type=gha,scope=clock-check-runner
          cache-to: type=gha,mode=max,scope=clock-check-runner
      - name: Check every Berry app independently of deploy selection
        run: make clock-check CHECK_BUILD=0 CHECK_ALL=true LOCAL_CONFIG=

      - name: Build cached status integration runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          target: integration
          load: true
          tags: tc002-apps/server/status-check:local
          cache-from: type=gha,scope=status-check-runner
          cache-to: type=gha,mode=max,scope=status-check-runner
      - name: Check status producer and screen
        run: make status-check CHECK_BUILD=0
      - name: Build cached weather integration runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          target: weather-integration
          load: true
          tags: tc002-apps/server/weather-check:local
          cache-from: type=gha,scope=weather-check-runner
          cache-to: type=gha,mode=max,scope=weather-check-runner
      - name: Check weather producer and both screens
        run: make weather-check CHECK_BUILD=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clock-check
          path: dist/clock-check/
