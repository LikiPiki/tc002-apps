name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CONFIG: testdata/ci/config.toml
  LOCAL_CONFIG: ""

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make check
      - name: Build six platform archives and checksums
        run: make release VERSION="$GITHUB_REF_NAME" COMMIT="$GITHUB_SHA"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/release/"$GITHUB_REF_NAME"/*.tar.gz \
            dist/release/"$GITHUB_REF_NAME"/SHA256SUMS \
            --verify-tag --generate-notes
